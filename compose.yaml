name: cloud-native-observability-lab

services:
  gateway:
    build:
      context: .
      target: runtime
    environment:
      SERVICE_ROLE: gateway
      PORT: 8080
      DEPENDENCY_URL: http://dependency:8081
      DEPENDENCY_TIMEOUT_MS: 1500
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      LOG_LEVEL: info
    depends_on:
      dependency:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports: ['127.0.0.1:8080:8080']
    networks: [telemetry]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ['no-new-privileges:true']
    labels:
      observability.logs: 'true'

  dependency:
    build:
      context: .
      target: runtime
    environment:
      SERVICE_ROLE: dependency
      PORT: 8081
      DEPENDENCY_URL: http://dependency:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      LOG_LEVEL: info
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:8081/health/live']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [telemetry]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ['no-new-privileges:true']
    labels:
      observability.logs: 'true'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./config/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on: [tempo]
    networks: [telemetry]
    security_opt: ['no-new-privileges:true']

  prometheus:
    image: prom/prometheus:v3.13.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ['127.0.0.1:9090:9090']
    networks: [telemetry]
    security_opt: ['no-new-privileges:true']

  tempo:
    image: grafana/tempo:3.0.2
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./config/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports: ['127.0.0.1:3200:3200']
    networks: [telemetry]
    security_opt: ['no-new-privileges:true']

  loki:
    image: grafana/loki:3.7.6
    command: ['-config.file=/etc/loki/local-config.yaml']
    volumes:
      - ./config/loki/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports: ['127.0.0.1:3100:3100']
    networks: [telemetry]
    security_opt: ['no-new-privileges:true']

  alloy:
    image: grafana/alloy:v1.18.1
    command: ['run', '/etc/alloy/config.alloy', '--storage.path=/var/lib/alloy/data']
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki]
    networks: [telemetry]
    security_opt: ['no-new-privileges:true']

  grafana:
    image: grafana/grafana:13.1.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, tempo, loki]
    ports: ['127.0.0.1:3000:3000']
    networks: [telemetry]
    security_opt: ['no-new-privileges:true']

networks:
  telemetry:
    internal: true

volumes:
  prometheus-data:
  tempo-data:
  loki-data:
  alloy-data:
  grafana-data:
