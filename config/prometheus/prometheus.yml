global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: [gateway:8080]
  - job_name: dependency
    static_configs:
      - targets: [dependency:8081]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:9464]
