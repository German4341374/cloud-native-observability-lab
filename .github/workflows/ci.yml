name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and configuration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run formatting, lint, types, tests, and build
        run: npm run check
      - name: Validate JSON and Compose
        run: |
          jq empty config/grafana/dashboards/service-overview.json
          docker compose config --quiet
      - name: Validate Prometheus configuration
        run: >-
          docker run --rm -v "$PWD/config/prometheus:/etc/prometheus"
          --entrypoint=promtool prom/prometheus:v3.13.2
          check config /etc/prometheus/prometheus.yml
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.12.0-alpine hadolint - < Dockerfile
      - name: Scan repository
        run: >-
          docker run --rm -v "$PWD:/workspace" aquasec/trivy:0.72.0
          fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL
          --exit-code 1 --no-progress /workspace

  stack-smoke:
    name: Full telemetry stack smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.18.0
      - name: Build and start telemetry stack
        run: docker compose up --build --detach
      - name: Verify metrics, logs, traces, dashboard, and controlled failure
        run: node scripts/smoke.mjs
      - name: Capture diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop telemetry stack
        if: always()
        run: docker compose down --volumes --remove-orphans
